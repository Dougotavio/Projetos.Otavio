<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo, descricao)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${titulo} + ' | Artes Marciais'">Artes Marciais</title>
	<meta name="description" th:content="${descricao}">
	<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
	<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
	<link rel="stylesheet" th:href="@{/css/estilo.css}">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Artes Marciais">
	<meta property="og:title" th:content="${titulo}">
	<meta property="og:description" th:content="${descricao}">
	<meta property="og:image" th:content="@{/images/logo-96.png}">
	<meta property="og:locale" content="pt_BR">
	<meta name="twitter:card" content="summary">
</head>

<body>

<header th:fragment="cabecalho" class="cabecalho">
	<div class="container">
		<a class="marca" th:href="@{/}">
			<img class="marca-icone" th:src="@{/images/logo-96.png}" width="48" height="48" alt="Logo Artes Marciais">
			<span>Artes<strong>Marciais</strong></span>
		</a>
		<nav>
			<a th:href="@{/}">Inicio</a>
			<a th:href="@{/artes}">Artes</a>
			<a th:href="@{/recomendacao}">Encontre sua arte</a>
			<a th:href="@{/simulacao}">Simulação</a>
			<a th:href="@{/academias}">Academias</a>
			<a th:href="@{/roupas}">Roupas</a>
			<a th:href="@{/lojas}">Equipamentos</a>
			<a th:href="@{/comparativo}">Comparativo</a>
			<a th:href="@{/sobre}">Sobre</a>
		</nav>
	</div>
</header>

<footer th:fragment="rodape" class="rodape">
	<div class="container">
		<p>Projeto de estudo com Spring Boot e Thymeleaf.</p>
		<p class="nota">Conteudo educativo. Nenhuma das artes aqui descritas substitui
			a orientacao de um instrutor qualificado.</p>
	</div>
</footer>

</body>

</html>
