<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${titulo} + ' | Artes Marciais'">Artes Marciais</title>
	<link rel="icon" type="image/png" sizes="128x128" th:href="@{/images/logo.png}">
	<link rel="apple-touch-icon" th:href="@{/images/logo.png}">
	<link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>

<header th:fragment="cabecalho" class="cabecalho">
	<div class="container">
		<a class="marca" th:href="@{/}">
			<img class="marca-icone" th:src="@{/images/logo.png}" alt="Logo Artes Marciais">
			<span>Artes<strong>Marciais</strong></span>
		</a>
		<nav>
			<a th:href="@{/}">Inicio</a>
			<a th:href="@{/artes}">Artes</a>
			<a th:href="@{/recomendacao}">Encontre sua arte</a>
			<a th:href="@{/roupas}">Roupas</a>
			<a th:href="@{/lojas}">Equipamentos</a>
			<a th:href="@{/comparativo}">Comparativo</a>
			<a th:href="@{/sobre}">Sobre</a>
		</nav>
	</div>
</header>

<footer th:fragment="rodape" class="rodape">
	<div class="container">
		<p>Projeto de estudo com Spring Boot e Thymeleaf.</p>
		<p class="nota">Conteudo educativo. Nenhuma das artes aqui descritas substitui
			a orientacao de um instrutor qualificado.</p>
	</div>
</footer>

</body>

</html>
